[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is set dynamically in env.py from the DATABASE_URL env var
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

;  The big picture

;     When you run alembic upgrade head, Alembic:
;     1. Reads alembic.ini to find the alembic/ directory and logging config
;     2. Adds /app/ to sys.path (via prepend_sys_path)
;     3. Runs alembic/env.py, which pulls DATABASE_URL from the environment and sets it as the connection string
;     4. Applies any pending migration files from alembic/versions/ in order