services:
  backend:
    image: recipe_backend:1.0
    container_name: recipe_backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
    restart: unless-stopped
    networks:
      - recipe-network
  db:
    # Postgres 18 stores the cluster in /var/lib/postgresql/18/docker.
    # Mount the volume at /var/lib/postgresql, not /var/lib/postgresql/data.
    image: postgres:18
    container_name: recipe_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe_db
    ports:
      - "5432:5432"
    volumes:
      - recipe_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_db -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - recipe-network
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - recipe-network
  frontend:
    image: recipe-frontend:1.0
    build:
      context: ./frontend
    container_name: recipe_frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started # might want to change to service healthy
    # Mount source for live-reloading, but ignore node_modules
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    networks:
      - recipe-network

volumes:
  recipe_db_data:

networks:
  recipe-network:
    driver: bridge
